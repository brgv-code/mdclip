name: Publish

# Tag a release (git tag v0.1.0 && git push --tags) to publish to npm.
# Uses npm trusted publishing (OIDC): enable it for the package on npmjs.com under
# Package settings > Trusted publishers, pointing at this repo and workflow file.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: npm publish --provenance --access public
